  <g fill="#E6F3FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600"><text x="58" y="100">REACT / VITE</text><text x="276" y="100">EXPRESS API</text><text x="494" y="100">AUTH + DOMAIN</text><text x="712" y="100">MONGOOSE</text><text x="930" y="100">MONGODB</text></g>
  <g fill="#A9B7C8" font-family="IBM Plex Mono,Consolas,monospace" font-size="13"><text x="42" y="128">inventory UI</text><text x="260" y="128">validated routes</text><text x="478" y="128">FEFO · audit</text><text x="696" y="128">models · indexes</text><text x="914" y="128">transactions</text></g>

  <text x="28" y="34" fill="#22D3EE" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" letter-spacing="2">04 / PHARMASTOCK · DATA + TRANSACTION ENGINE</text>
  <g fill="#10161F" stroke="#253140" stroke-width="1.3"><rect x="24" y="72" width="190" height="88" rx="9"/><rect x="242" y="72" width="190" height="88" rx="9"/><rect x="460" y="72" width="190" height="88" rx="9"/><rect x="678" y="72" width="190" height="88" rx="9"/><rect x="896" y="72" width="180" height="88" rx="9"/></g>
